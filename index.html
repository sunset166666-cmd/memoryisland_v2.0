<script>
const $=id=>document.getElementById(id),TAU=Math.PI*2,V3=THREE.Vector3;

const mix=(a,b,f)=>a.map((v,i)=>v+(b[i]-v)*f);

const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:sc(new THREE.Color(),c),roughness:.9},o));
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};

// ---------- renderer / scene ----------
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;

// ---------- terrain ----------
const RR=24;

const MX=66,MZ=80,MR=15,MA=Math.atan2(80,66);
const PLT=[[-5.2,8.2,6.4,1.9],[5.4,7.4,4.4,1.68]];
function H(x,z){let h=H0(x,z);for(const p of PLT){const d=Math.hypot(x-p[0],z-p[1]);if(d<p[2]+2.6){const f=cl((d-p[2])/2.6),k=f*f*(3-2*f);h=p[3]*(1-k)+h*k}}const q=1-((x-MX)*(x-MX)+(z-MZ)*(z-MZ))/(MR*MR);if(q>-.1){const mh=q*1.9-.35+Math.sin(x*.4)*Math.cos(z*.35)*.16*Math.max(q,0);if(mh>h)h=mh}return h}
const DEEP=[16,66,92],WET=[168,146,104],SAND=[232,212,164],G1=[104,166,96],G2=[134,184,104];
function tcol(h){if(h<-.8)return DEEP;if(h<0)return mix(DEEP,WET,(h+.8)/.8);if(h<.45)return mix(WET,SAND,h/.45);if(h<.9)return mix(SAND,G1,(h-.45)/.45);return mix(G1,G2,cl((h-.9)/1))}
const tg=new THREE.PlaneGeometry(66,66,170,170);tg.rotateX(-Math.PI/2);
{const p=tg.attributes.position,cs=new Float32Array(p.count*3);
 for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),h=H(x,z);p.setY(i,h);const n=1+Math.sin(x*3.1)*Math.sin(z*2.7)*.05,c=tcol(h);cs.set([c[0]/255*n,c[1]/255*n,c[2]/255*n],i*3)}
 tg.setAttribute('color',new THREE.BufferAttribute(cs,3));tg.computeVertexNormals()}

// ---------- sea ----------
const sg=new THREE.PlaneGeometry(320,320,110,110);sg.rotateX(-Math.PI/2);

for(let i=0;i<sp.count;i++){bx[i]=sp.getX(i);bz[i]=sp.getZ(i)}
const sea=new THREE.Mesh(sg,new THREE.MeshStandardMaterial({color:0x2a7a98,roughness:.22,metalness:.15,transparent:true,opacity:.84,vertexColors:true}));scene.add(sea);
const cA=new Float32Array(sp.count*3).fill(1);sg.setAttribute('color',new THREE.BufferAttribute(cA,3));
const sm=new Float32Array(sp.count);for(let i=0;i<sp.count;i++)sm[i]=Math.exp(-(((H(bx[i],bz[i])+.02)/.3)**2));

function tex(hard){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);

 else{g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(255,255,255,0)')}

const stp=new Float32Array(700*3);
for(let i=0;i<700;i++){const u=rnd()*TAU,y=rnd()*.98+.02,r=Math.sqrt(1-y*y);stp.set([Math.cos(u)*r*380,y*380,Math.sin(u)*r*380],i*3)}

const stars=new THREE.Points(sgeo,new THREE.PointsMaterial({size:1.8,sizeAttenuation:false,color:0xfff6e0,transparent:true,depthWrite:false,fog:false}));stars.frustumCulled=false;scene.add(stars);

// ---------- scenery ----------
const leaves=[];function tree(x,z,s){const g=new THREE.Group();g.position.set(x,H(x,z),z);
 const tr=new THREE.Mesh(new THREE.CylinderGeometry(.1*s,.18*s,1.8*s,6),mat([120,86,64]));tr.position.y=.9*s;

const NOGO=[[-5.2,8.2,7.4],[5.4,7.4,5],[1.6,2,1.2]],free=(x,z,m=0)=>NOGO.every(c=>Math.hypot(x-c[0],z-c[1])>c[2]+m);
const placed=[[0,5]];
for(let n=0,k=0;n<26&&k<1500;k++){const x=(rnd()-.5)*46,z=(rnd()-.5)*46;
 if(H(x,z)>.95&&free(x,z)&&placed.every(p=>Math.hypot(p[0]-x,p[1]-z)>3.2)){placed.push([x,z]);tree(x,z,.8+rnd()*.6);n++}}
for(let n=0,k=0;n<16&&k<400;k++){const a=rnd()*TAU,d=19+rnd()*3.5,x=Math.cos(a)*d,z=Math.sin(a)*d;
 const r=new THREE.Mesh(new THREE.IcosahedronGeometry(.5+rnd()*.4,0),mat([120,118,126],{flatShading:true}));r.position.set(x,H(x,z)+.1,z);r.scale.y=.6;r.rotation.y=rnd()*3;r.castShadow=true;scene.add(r);n++}
{const pal=[[250,170,196],[255,250,240],[255,224,130],[196,176,255]],wf=new THREE.InstancedMesh(new THREE.SphereGeometry(.07,5,4),mat([255,255,255],{roughness:.6}),420),m4=new THREE.Matrix4(),cc=new THREE.Color();
 for(let n=0,k=0;n<420&&k<6000;k++){const x=(rnd()-.5)*46,z=(rnd()-.5)*46,h=H(x,z);if(h<.7||!free(x,z))continue;
  m4.setPosition(x,h+.07,z);wf.setMatrixAt(n,m4);wf.setColorAt(n,sc(cc,pal[Math.floor(rnd()*4)]));n++}

const ffN=110,ffB=[],ffP=new Float32Array(ffN*3);
for(let i=0;i<ffN;i++){let x,z;do{x=(rnd()-.5)*44;z=(rnd()-.5)*44}while(H(x,z)<.4);ffB.push([x,H(x,z),z,rnd()*TAU])}
const ffG=new THREE.BufferGeometry();ffG.setAttribute('position',new THREE.BufferAttribute(ffP,3));
const ffM=new THREE.Points(ffG,new THREE.PointsMaterial({map:glowT,size:.45,color:0xe8ffb0,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending}));ffM.frustumCulled=false;scene.add(ffM);

// ---------- character ----------
const ch=new THREE.Group(),bod=new THREE.Group();ch.add(bod);
function part(geo,c,x,y,z){const m=new THREE.Mesh(geo,mat(c,{roughness:.7}));m.position.set(x,y,z);m.castShadow=true;bod.add(m);return m}
part(new THREE.CylinderGeometry(.2,.38,.9,10),[246,238,226],0,.5,0);
part(new THREE.SphereGeometry(.22,12,10),[246,214,184],0,1.2,0);
part(new THREE.SphereGeometry(.245,12,10,0,TAU,0,Math.PI*.58),[58,40,56],0,1.24,-.02).rotation.x=-.25;
part(new THREE.SphereGeometry(.12,8,6),[58,40,56],0,1.18,-.22);
for(const sd of[-1,1]){part(new THREE.CylinderGeometry(.05,.042,.5,6),[246,238,226],sd*.3,.68,0).rotation.z=sd*.16;part(new THREE.SphereGeometry(.052,8,6),[246,214,184],sd*.36,.42,0)}
part(new THREE.TorusGeometry(.2,.055,6,16),[232,120,140],0,.98,0).rotation.x=Math.PI/2;
part(new THREE.SphereGeometry(.03,6,5),[40,30,40],-.08,1.2,.2);part(new THREE.SphereGeometry(.03,6,5),[40,30,40],.08,1.2,.2);

if(!Array.isArray(mems))mems=[{id:1,x:1.6,z:2,t:'这是你的第一朵花。点一下它，就能读到当时写下的话。',d:'今天',h:330}];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(mems))}catch(e){toast('浏览器存不下了（照片太多或存储被禁用），刷新后可能丢失')}};
function addFlower(m,born){const g=new THREE.Group(),col=new THREE.Color().setHSL(m.h/360,.75,.72);g.position.set(m.x,H(m.x,m.z)+(Math.hypot(m.x-5.4,m.z-7.4)<4?.08:0),m.z);

 const head=new THREE.Mesh(new THREE.SphereGeometry(.09,8,6),new THREE.MeshStandardMaterial({color:0xffe9a8,emissive:0xffd070,emissiveIntensity:.6}));head.position.y=.74;g.add(head);
 for(let i=0;i<6;i++){const a=i/6*TAU,p=new THREE.Mesh(new THREE.SphereGeometry(.1,6,5),new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.35,roughness:.6}));

// ---------- audio (synthesized) ----------
let AC,master,musicBus,noiseW,noiseB,ambGain,hissGain,windGain,sndOn=true,stepT=0,pi=0;
function mkNoise(brown){const n=AC.sampleRate*3,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);let l=0;

 const rv=AC.createConvolver(),n=AC.sampleRate*2.6,ir=AC.createBuffer(2,n,AC.sampleRate),rg=AC.createGain();

 rv.buffer=ir;rg.gain.value=.5;rv.connect(rg);rg.connect(master);
 musicBus=AC.createGain();musicBus.gain.value=.7;musicBus.connect(master);musicBus.connect(rv);
 setInterval(music,3400);setInterval(critter,1200);setInterval(pad,14000);pad()}

function tone(f,dur=1.2,vol=.15,type='sine',bus=master,when=0){if(!AC||!sndOn)return;const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+when;

 o.connect(g);g.connect(bus);o.start(t0);o.stop(t0+dur+.05)}

 s.buffer=buf;f.type=type;f.frequency.value=freq;if(q)f.Q.value=q;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
 s.connect(f);f.connect(g);g.connect(master);s.start(t0,Math.random()*2,dur+.05)}

function cottageLocal(){
  return cottage.worldToLocal(
    new THREE.Vector3(
      ch.position.x,
      ch.position.y,
      ch.position.z
    )
  );
}

function setCottageMode(inside){

  insideCottage=inside;
  upFloor=false;
  inBath=false;
  f2.visible=false;

  cottageExterior.forEach(
    o=>o.visible=!inside
  );

  interior.visible=inside;

  $('home').style.display='block';
  $('home').textContent=inside?'出门':'进屋';

  interiorWarmLight.intensity=
    inside?.9+1.1*night:0;

  deskLamp.intensity=
    inside?.35+.65*night:0;

  ceilingLamp.intensity=
    inside?.5+.8*night:0;

  floorLampLight.intensity=
    inside?.35+.5*night:0;

  toast(
    inside?
    '欢迎回家。':
    '回到小岛上了。'
  );
}

function enterCottage(){

  const p=cottageLocal();

  if(
    Math.abs(p.x)>1.65||
    p.z>-1.65||
    p.z<-3.45
  ){
    toast('请走到小屋正门附近');
    return;
  }

  p.set(0,.55,-1.15);

  const w=cottage.localToWorld(p);

  ch.position.set(
    w.x,
    COTTAGE_Y+.43,
    w.z
  );

  setCottageMode(true);
}

function exitCottage(){

  const p=cottageLocal();

  p.set(0,-.02,-3.15);

  const w=cottage.localToWorld(p);

  ch.position.set(
    w.x,
    H(w.x,w.z),
    w.z
  );

  setCottageMode(false);
}

[['八度−',b=>{pOct=Math.max(1,pOct-1);pBuild()}],['八度+',b=>{pOct=Math.min(6,pOct+1);pBuild()}],['延音',b=>{pSus=!pSus;b.style.background=pSus?'#a06ad0':'';if(!pSus)Object.keys(voices).forEach(m=>pnOff(+m,true,true))}],
